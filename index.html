<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
    <title>DesafioPOI— Diagnóstico POI em 21 Dias</title>
    <meta name="description" content="Descubra por que seu cão te ignora e receba um plano personalizado de obediência em 21 dias com o Protocolo POI.">

    <!-- DNS prefetch + preconnect dos domínios críticos -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />
    <link rel="dns-prefetch" href="https://www.facebook.com" />

    <!-- Fonte system primeiro, swap para Inter quando carregar (não bloqueia) -->
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet" /></noscript>

    <meta property="og:type" content="website" />
    <meta property="og:title" content="DesafioPOI— Diagnóstico POI em 21 Dias">
    <meta property="og:description" content="Descubra por que seu cão te ignora e receba um plano personalizado de obediência em 21 dias com o Protocolo POI.">

    <!-- CSS inline crítico — pinta a tela imediatamente, antes do JS carregar -->
    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;color:#0a1638;overflow-x:hidden}
      #root{min-height:100vh;display:flex;flex-direction:column}
      /* Splash inicial: aparece antes do React montar */
      #initial-splash{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;animation:fade-in .25s ease}
      #initial-splash .spinner{width:36px;height:36px;border:3px solid #e3e6f0;border-top-color:#2b6cf0;border-radius:50%;animation:spin .8s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes fade-in{from{opacity:0}to{opacity:1}}
    </style>

    <!-- Meta Pixel — carregamento adiado para não bloquear o paint -->
    <script>
      window.fbq=window.fbq||function(){(window.fbq.q=window.fbq.q||[]).push(arguments)};
      window.fbq.l=+new Date;
      window.fbq.queue=[];
      // PageView entra na fila — será executado quando o script carregar
      fbq('init','1647727386472022');
      fbq('set','autoConfig',false,'1647727386472022');
      // Carrega o script do Pixel APÓS o load completo da página (não bloqueia)
      window.addEventListener('load',function(){
        var s=document.createElement('script');
        s.async=true;
        s.src='https://connect.facebook.net/en_US/fbevents.js';
        document.head.appendChild(s);
      });
    </script>
  </head>

  <body>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1647727386472022&ev=PageView&noscript=1" /></noscript>
    <div id="root">
      <!-- Splash visível imediatamente — some quando o React monta -->
      <div id="initial-splash">
        <div class="spinner"></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
