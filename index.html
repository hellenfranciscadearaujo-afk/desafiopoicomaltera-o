<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>DesafioPOI — Diagnóstico POI em 21 Dias</title>
    <meta name="description" content="Descubra por que seu cão te ignora e receba um plano personalizado de obediência em 21 dias com o Protocolo POI.">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://connect.facebook.net" />

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="DesafioPOI — Diagnóstico POI em 21 Dias">
    <meta property="og:description" content="Descubra por que seu cão te ignora e receba um plano personalizado de obediência em 21 dias com o Protocolo POI.">

    <style>
      *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
      html,body{height:100%;background:#fff;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
      body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Inter",sans-serif;color:#0a1638;overflow-x:hidden}
      #root{min-height:100vh;display:flex;flex-direction:column}
      #initial-splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#fff;z-index:9999;transition:opacity .3s ease-out}
      #initial-splash.hidden{opacity:0;pointer-events:none}
      #initial-splash .spinner{width:36px;height:36px;border:3px solid #e3e6f0;border-top-color:#2b6cf0;border-radius:50%;animation:spin .8s linear infinite}
      #initial-splash .fallback{display:none;margin-top:24px;text-align:center;padding:0 24px;max-width:320px}
      #initial-splash.timeout .spinner{display:none}
      #initial-splash.timeout .fallback{display:block}
      #initial-splash .fallback p{font-size:14px;color:#475569;line-height:1.5;margin-bottom:12px}
      #initial-splash .fallback button{background:linear-gradient(135deg,#0a1638,#2b6cf0);color:#fff;border:none;border-radius:999px;padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer}
      @keyframes spin{to{transform:rotate(360deg)}}
    </style>

    <!-- Meta Pixel Code -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '1647727386472022');
      fbq('set', 'autoConfig', false, '1647727386472022');
    </script>
    <!-- End Meta Pixel Code -->
  </head>

  <body>
    <noscript><img height="1" width="1" style="display:none" src="https://www.facebook.com/tr?id=1647727386472022&ev=PageView&noscript=1" /></noscript>

    <!-- Splash FORA do #root: assim a montagem do React não conflita com ele.
         Caso algo falhe no carregamento, mostramos um fallback após 12s. -->
    <div id="initial-splash">
      <div class="spinner"></div>
      <div class="fallback">
        <p>Estamos demorando mais que o esperado. Verifique sua conexão e tente recarregar a página.</p>
        <button onclick="window.location.reload()">Recarregar</button>
      </div>
    </div>

    <div id="root"></div>

    <script>
      // Se em 12s o splash ainda existir (React não montou), mostra fallback.
      setTimeout(function(){
        var el = document.getElementById("initial-splash");
        if (el && !el.classList.contains("hidden")) {
          el.classList.add("timeout");
        }
      }, 12000);
    </script>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
